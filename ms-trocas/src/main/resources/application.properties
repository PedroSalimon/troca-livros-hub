spring.application.name=ms-trocas

spring.profiles.active=dev
spring.jpa.open-in-view=false

# Porta aleatória: permite subir várias instâncias
server.port=0

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.confirmarTroca.slidingWindowSize=3
resilience4j.circuitbreaker.instances.confirmarTroca.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.confirmarTroca.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.confirmarTroca.failureRateThreshold=50
resilience4j.circuitbreaker.instances.confirmarTroca.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.confirmarTroca.permittedNumberOfCallsInHalfOpenState=2
